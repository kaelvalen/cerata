[build-system]
requires = ["setuptools>=61.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cerata"
version = "0.2.0"
description = "CERATA: closed-form, exactly reversible, auditable learning after deployment (formerly PAL-MoE)"
readme = "README.md"
license = { text = "MIT" }
authors = [
    { name = "kaelvalen", email = "yintsukuyomi@proton.me" }
]
maintainers = [
    { name = "kaelvalen", email = "yintsukuyomi@proton.me" }
]
requires-python = ">=3.10"
keywords = [
    "continual-learning",
    "class-incremental-learning",
    "knowledge-editing",
    "machine-unlearning",
    "closed-form",
    "pre-trained-models",
    "pytorch",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "torch>=2.0.0",
    "torchvision>=0.15.0",
    "numpy>=1.24.0",
    "scipy>=1.10.0",
    "scikit-learn>=1.2.0",
    "matplotlib>=3.7.0",
    "tabulate>=0.9.0",
]

[project.optional-dependencies]
# The linters are pinned to the versions CI runs; black's output also depends on
# the interpreter, so check formatting under Python 3.12 (CONTRIBUTING.md).
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=5.0.0",
    "ruff==0.16.8",
    "black==26.5.1",
]
# The v3 LM backend (cerata.core.hf_lm): `dtype=` in from_pretrained needs
# transformers >= 4.56; 4-bit loading needs bitsandbytes and device_map accelerate.
lm = [
    "transformers>=4.56.0",
    "accelerate>=1.0.0",
    "bitsandbytes>=0.45.0",
]
# Frozen ViT feature extraction for the PTM-CIL study (experiments/extract_ptm_features.py).
ptm = [
    "timm>=1.0.0",
    "gdown>=5.0.0",  # experiments/prepare_ptm_data.py: the Google Drive splits
]

[project.urls]
Homepage = "https://github.com/kaelvalen/pal-moe"
Repository = "https://github.com/kaelvalen/pal-moe.git"
"Bug Tracker" = "https://github.com/kaelvalen/pal-moe/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["cerata*", "pal_moe"]

# The lint target stays py39 on purpose: it keeps the syntax a subset of what
# 3.10 accepts without rewriting ~190 annotations and zip() calls in
# cerata/legacy, whose behaviour is frozen bitwise.
[tool.black]
line-length = 88
target-version = ["py39"]

[tool.ruff]
line-length = 88
target-version = "py39"
src = ["cerata", "pal_moe", "experiments", "tests"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "W", "I", "B", "UP"]
ignore = [
    "E501",  # line length is enforced by black; long help strings stay intact
    "B008",  # torch.device("cpu") defaults are idiomatic in this codebase
]

[tool.ruff.lint.isort]
known-first-party = ["cerata", "pal_moe"]

[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-v --strict-markers"
